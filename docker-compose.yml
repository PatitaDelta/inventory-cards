version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ygo_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: inventario_ygo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: guillermolillo/inventory-cards-app:latest
    container_name: ygo_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=0.0.0.0
      - APP_PASSWORD=pon_aqui_una_contraseña_larga
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=inventario_ygo
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: